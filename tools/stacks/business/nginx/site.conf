server {
  listen 80 default_server;
  server_name __PRIMARY_HOST__ _;

  client_max_body_size 64m;

  # Serve static assets directly from bench
  location /assets/ {
    alias /var/www/html/sites/assets/;
    try_files $uri =404;
    access_log off;    expires 1y;
  }

  # WebSocket (Socket.IO)
  location /files/ {                      # public files, per site (folder chosen by address)
    root /var/www/html/sites/$host/public;
    try_files $uri =404;
    expires 7d;
  }

  location /socket.io/ {
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";

    # Critical: site mapping (fixes "Invalid namespace")
    proxy_set_header Host $host;
    proxy_set_header X-Frappe-Site-Name $host;

    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    proxy_read_timeout 86400;

    # Important: don't append /socket.io/ here (avoid double path)
    proxy_pass http://__STACK__-socketio:9000;
  }
  
# Everything else → backend (Frappe)
  location / {
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 120;
    proxy_redirect off;
    proxy_pass http://__STACK__-backend:8000;
  }
}
