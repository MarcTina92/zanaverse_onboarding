map $arg_doctype $zs_pdf_prefix {
  "Sales%20Invoice" "Fee-Invoice-";
  "Sales+Invoice"   "Fee-Invoice-";
  default           "";
}

server {
  listen 80 default_server;
  resolver 127.0.0.11 valid=10s ipv6=off;   # re-resolve containers (no 502 after restarts)
  server_name __PRIMARY_HOST__ _;
  client_max_body_size 64m;

  location /assets/ {
    alias /var/www/html/sites/assets/;
    try_files $uri =404;
    access_log off;
    expires 1y;
  }

  location /files/ {                      # public files, per site (multi-site: folder chosen by address)
    root /var/www/html/sites/$host/public;
    try_files $uri =404;
    expires 7d;
  }

  location /socket.io/ {
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Frappe-Site-Name $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 86400;
    set $zs_socketio __STACK__-socketio; proxy_pass http://$zs_socketio:9000;
  }

  location = /api/method/frappe.utils.print_format.download_pdf {
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 120;
    proxy_redirect off;
    set $zs_backend __STACK__-backend; proxy_pass http://$zs_backend:8000;
    proxy_hide_header Content-Disposition;
    add_header Content-Disposition 'attachment; filename="$zs_pdf_prefix$arg_name.pdf"' always;
  }

  location / {
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 120;
    proxy_redirect off;
    set $zs_backend __STACK__-backend; proxy_pass http://$zs_backend:8000;
  }
}
